# Draft only: review before adding to any repository.
name: Temporary private scheduler secret handoff
on: workflow_dispatch
permissions: {}
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_TOKEN: ${{ secrets.TEMP_CF_WORKER_TOKEN }}
      CLOUDFLARE_ACCOUNT: ${{ secrets.TEMP_CF_ACCOUNT }}
      CLOUDFLARE_WORKER: ${{ secrets.TEMP_CF_WORKER }}
      SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}
      SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
    steps:
      - name: Copy encrypted scheduler settings to the designated Worker
        shell: bash
        run: |
          node <<'NODE'
          const { CLOUDFLARE_TOKEN, CLOUDFLARE_ACCOUNT, CLOUDFLARE_WORKER, SCHEDULER_URL, SCHEDULER_TOKEN } = process.env;
          (async () => {
            if (!CLOUDFLARE_TOKEN || !/^[a-f0-9]{32}$/.test(CLOUDFLARE_ACCOUNT) || !/^[a-z0-9-]+$/.test(CLOUDFLARE_WORKER) || !SCHEDULER_URL || !SCHEDULER_TOKEN) throw new Error('Missing config');
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT}/workers/scripts/${CLOUDFLARE_WORKER}/secrets`;
            for (const [name, text] of [['SCHEDULER_URL', SCHEDULER_URL], ['SCHEDULER_TOKEN', SCHEDULER_TOKEN]]) {
              const r = await fetch(endpoint, { method: 'PUT', redirect: 'error', headers: {
                Authorization: `Bearer ${CLOUDFLARE_TOKEN}`, 'Content-Type': 'application/json'
              }, body: JSON.stringify({ name, text, type: 'secret_text' }), signal: AbortSignal.timeout(30000) });
              if (!r.ok) throw new Error('Transfer failed');
              const body = await r.json();
              if (body.success !== true) throw new Error('Transfer failed');
            }
            console.log('Worker secrets installed');
          })().catch(() => { console.error('Worker secret transfer failed'); process.exitCode = 1; });
          NODE
